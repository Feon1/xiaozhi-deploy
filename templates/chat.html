<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaozhi Chat</title>
    <style>
        /* ===== ЦВЕТОВЫЕ ПЕРЕМЕННЫЕ ===== */
        :root {
            /* Светлая тема */
            --bg-body: #f0f2f5;
            --bg-header: #3498db;
            --bg-chat: #ffffff;
            --bg-footer: #ffffff;
            --bg-msg-user: #3498db;
            --bg-msg-ai: #ffffff;
            --bg-msg-system: #e2e8f0;
            --bg-msg-error: #fee;
            --text-header: #ffffff;
            --text-msg-user: #ffffff;
            --text-msg-ai: #1e293b;
            --text-msg-system: #475569;
            --text-msg-error: #c0392b;
            --border-chat: #e2e8f0;
            --border-msg-ai: #e2e8f0;
            --border-msg-error: #fcc;
            --border-input: #ddd;
            --bg-btn-send: #2ecc71;
            --bg-btn-send-hover: #27ae60;
            --bg-btn-clear: #e74c3c;
            --bg-btn-clear-hover: #c0392b;
            --bg-btn-disabled: #bdc3c7;
            --bg-btn-theme: rgba(255,255,255,0.2);
            --bg-btn-theme-hover: rgba(255,255,255,0.3);
            --text-status: rgba(255,255,255,0.9);
        }

        /* Тёмная тема */
        body.dark-theme {
            --bg-body: #0f172a;
            --bg-header: #1e293b;
            --bg-chat: #1e293b;
            --bg-footer: #1e293b;
            --bg-msg-user: #3b82f6;
            --bg-msg-ai: #334155;
            --bg-msg-system: #334155;
            --bg-msg-error: #7f1d1d;
            --text-header: #f1f5f9;
            --text-msg-user: #ffffff;
            --text-msg-ai: #e2e8f0;
            --text-msg-system: #94a3b8;
            --text-msg-error: #fecaca;
            --border-chat: #334155;
            --border-msg-ai: #475569;
            --border-msg-error: #991b1b;
            --border-input: #475569;
            --bg-btn-send: #059669;
            --bg-btn-send-hover: #047857;
            --bg-btn-clear: #dc2626;
            --bg-btn-clear-hover: #b91c1c;
            --bg-btn-disabled: #475569;
            --bg-btn-theme: rgba(255,255,255,0.15);
            --bg-btn-theme-hover: rgba(255,255,255,0.25);
            --text-status: rgba(241,245,249,0.9);
        }

        /* ===== БАЗОВЫЕ СТИЛИ ===== */
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-body);
            color: var(--text-msg-ai);
            transition: background 0.3s, color 0.3s;
        }

        /* ===== ШАПКА ===== */
        header {
            background: var(--bg-header);
            color: var(--text-header);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: background 0.3s;
        }
        header h1 { font-size: 18px; margin: 0; }
        #status { font-size: 13px; opacity: 0.9; }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== КНОПКА ТЕМЫ ===== */
        .btn-theme {
            background: var(--bg-btn-theme);
            color: var(--text-header);
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-theme:hover { background: var(--bg-btn-theme-hover); }

        /* ===== ОКНО ЧАТА ===== */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg-chat);
            transition: background 0.3s;
        }
        #chat::-webkit-scrollbar { width: 6px; }
        #chat::-webkit-scrollbar-thumb {
            background: var(--border-chat);
            border-radius: 3px;
        }

        /* ===== СООБЩЕНИЯ ===== */
        .msg {
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        .msg.user {
            background: var(--bg-msg-user);
            color: var(--text-msg-user);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg.ai {
            background: var(--bg-msg-ai);
            color: var(--text-msg-ai);
            border: 1px solid var(--border-msg-ai);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg.system {
            background: var(--bg-msg-system);
            color: var(--text-msg-system);
            align-self: center;
            font-size: 12px;
            font-style: italic;
        }
        .msg.error {
            background: var(--bg-msg-error);
            color: var(--text-msg-error);
            align-self: center;
            font-size: 13px;
            border: 1px solid var(--border-msg-error);
        }

        /* ===== ПОДВАЛ ===== */
        .footer {
            padding: 12px;
            background: var(--bg-footer);
            border-top: 1px solid var(--border-chat);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            transition: background 0.3s, border-color 0.3s;
        }
        textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-input);
            border-radius: 8px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
            font-size: 15px;
            background: var(--bg-msg-ai);
            color: var(--text-msg-ai);
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--bg-btn-send);
        }
        textarea::placeholder {
            color: var(--text-msg-system);
        }

        /* ===== КНОПКИ ===== */
        button {
            padding: 10px 20px;
            background: var(--bg-btn-send);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover { background: var(--bg-btn-send-hover); }
        button:disabled { background: var(--bg-btn-disabled); }
        .btn-clear {
            background: var(--bg-btn-clear);
            padding: 6px 12px;
            font-size: 13px;
        }
        .btn-clear:hover { background: var(--bg-btn-clear-hover); }
    </style>
</head>
<body>

<header>
    <h1>🤖 Xiaozhi Chat</h1>
    <div class="header-actions">
        <span id="status">Подключение...</span>
        <button class="btn-theme" id="btnTheme" onclick="toggleTheme()" title="Переключить тему">🌙</button>
        <button class="btn-clear" onclick="clearHistory()">Очистить</button>
    </div>
</header>

<div id="chat"></div>

<div class="footer">
    <textarea id="input" placeholder="Введите сообщение... (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button id="btnSend" onclick="sendMessage()">➤</button>
</div>

<script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btnSend = document.getElementById('btnSend');
    const statusEl = document.getElementById('status');
    const btnTheme = document.getElementById('btnTheme');

    let currentAiMsg = null;
    let streaming = false;

    // ===== ТЕМА =====
    function applyTheme(theme) {
        if (theme === 'dark') {
            document.body.classList.add('dark-theme');
            btnTheme.textContent = '☀️';
        } else {
            document.body.classList.remove('dark-theme');
            btnTheme.textContent = '🌙';
        }
    }

    function toggleTheme() {
        const isDark = document.body.classList.contains('dark-theme');
        const newTheme = isDark ? 'light' : 'dark';
        localStorage.setItem('xiaozhi-theme', newTheme);
        applyTheme(newTheme);
    }

    // Инициализация темы
    (function initTheme() {
        const saved = localStorage.getItem('xiaozhi-theme');
        if (saved) {
            applyTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    })();

    // ===== СООБЩЕНИЯ =====
    function addMessage(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function updateStatus(text) {
        statusEl.textContent = text;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text || streaming) return;

        addMessage(text, 'user');
        input.value = '';
        btnSend.disabled = true;
        streaming = true;

        try {
            const resp = await fetch('/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await resp.json();
            if (!data.ok) {
                addMessage('Ошибка: ' + (data.error || 'неизвестная'), 'error');
                streaming = false;
                btnSend.disabled = false;
                return;
            }
            addMessage(`[режим: ${data.mode}, ${data.bytes} байт]`, 'system');
        } catch (e) {
            addMessage('Ошибка сети: ' + e.message, 'error');
            streaming = false;
            btnSend.disabled = false;
        }
    }

    // ===== SSE-КАНАЛ =====
    const es = new EventSource('/events');
    es.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        const kind = data.kind;

        if (kind === 'status') {
            updateStatus(data.text);
            return;
        }
        if (kind === 'error') {
            addMessage('⚠️ ' + data.text, 'error');
            return;
        }
        if (kind === 'audio') {
            addMessage(`[аудио ${data.size} байт]`, 'system');
            return;
        }
        if (kind === 'stt') {
            addMessage(`[stt] ${data.text}`, 'system');
            return;
        }
        if (kind === 'llm') {
            return;
        }
        if (kind === 'tts_start') {
            currentAiMsg = null;
            return;
        }
        if (kind === 'tts') {
            if (data.state === 'sentence_start') {
                if (!currentAiMsg) {
                    currentAiMsg = addMessage('', 'ai');
                }
                currentAiMsg.textContent += (currentAiMsg.textContent ? ' ' : '') + data.text;
                chat.scrollTop = chat.scrollHeight;
            }
            return;
        }
        if (kind === 'tts_stop') {
            currentAiMsg = null;
            streaming = false;
            btnSend.disabled = false;
            return;
        }
    };

    es.onerror = () => {
        updateStatus('SSE-канал отключён, переподключение...');
    };

    async function clearHistory() {
        if (!confirm('Очистить историю?')) return;
        await fetch('/clear', {method: 'POST'});
        chat.innerHTML = '';
        addMessage('История очищена', 'system');
    }

    async function loadHistory() {
        try {
            const resp = await fetch('/history');
            const items = await resp.json();
            for (const item of items) {
                addMessage(item.text, item.role === 'user' ? 'user' : 'ai');
            }
        } catch (e) {}
    }

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    loadHistory();
</script>
</body>
</html>

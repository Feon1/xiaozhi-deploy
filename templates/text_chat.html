<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Xiaozhi — Текст</title>
</head>
<body>
<h2>Xiaozhi — текстовый режим</h2>
<p><a href="/">[ Графический режим ]</a></p>
<hr>

<div>
{% for m in history %}
<p><b>{% if m.role == 'user' %}Вы{% else %}AI{% endif %}:</b> {{ m.text }}</p>
{% endfor %}
</div>

<hr>
<form method="post" action="/text">
  <input type="text" name="text" size="60" autofocus>
  <input type="submit" value="Отправить">
</form>
<p><small>Обновите страницу (R в w3m), чтобы увидеть ответ.</small></p>
</body>
</html>

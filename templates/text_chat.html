<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="8">
<title>Xiaozhi — Текст</title>
</head>
<body>
<h2>Xiaozhi — текстовый режим</h2>
<p>
  <a href="/">[ Графический режим ]</a> |
  Статус: {% if ws_ready %}✅ онлайн{% else %}❌ нет связи{% endif %}
</p>
<hr>

<div>
{% for m in history %}
<p><b>{% if m.role == 'user' %}Вы{% else %}AI{% endif %}:</b> {{ m.text }}</p>
{% endfor %}
</div>

<hr>
<form method="post" action="/text">
  <input type="text" name="text" size="50" autofocus>
  <input type="submit" value="Отправить">
</form>
<p><small>Страница обновляется каждые 8 сек. Нажмите R в w3m, чтобы обновить вручную.</small></p>
</body>
</html>

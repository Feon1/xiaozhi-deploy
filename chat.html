<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaozhi Chat</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: system-ui, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f0f2f5;
        }

        header {
            background: #3498db;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 18px; margin: 0; }

        #status { font-size: 13px; opacity: 0.9; }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 15px;
            line-height: 1.4;
        }

        .msg.user {
            background: #3498db;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            background: white;
            border: 1px solid #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.system {
            background: #e2e8f0;
            color: #475569;
            align-self: center;
            font-size: 12px;
            font-style: italic;
        }

        .msg.error {
            background: #fee;
            color: #c0392b;
            align-self: center;
            font-size: 13px;
            border: 1px solid #fcc;
        }

        /* Панель выбора модели */
        #model-selector {
            padding: 8px 12px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 13px;
            flex-wrap: wrap;
        }

        #model-selector label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #model-dropdown {
            flex: 1;
            min-width: 150px;
            padding: 5px 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }

        #model-dropdown:disabled {
            background: #eef1f4;
            color: #94a3b8;
        }

        #refresh-models {
            padding: 5px 12px;
            font-size: 13px;
            background: #64748b;
        }

        #refresh-models:hover { background: #475569; }

        .footer {
            padding: 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
            font-size: 15px;
        }

        button {
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #27ae60; }
        button:disabled { background: #bdc3c7; }

        .btn-clear {
            background: #e74c3c;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-clear:hover { background: #c0392b; }
    </style>
</head>
<body>

<header>
    <h1>🤖 Xiaozhi Chat</h1>
    <div>
        <span id="status">Подключение...</span>
        <button class="btn-clear" onclick="clearHistory()">Очистить</button>
    </div>
</header>

<div id="chat"></div>

<!-- Панель выбора модели (над полем ввода) -->
<div id="model-selector">
    <label>
        <input type="checkbox" id="use-mnn">
        <span>Использовать MNN Chat</span>
    </label>
    <select id="model-dropdown" disabled>
        <option>Загрузка...</option>
    </select>
    <button id="refresh-models">Обновить</button>
</div>

<div class="footer">
    <textarea id="input" placeholder="Введите сообщение... (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button id="btnSend" onclick="sendMessage()">➤</button>
</div>

<script>
    // ===== Ссылки на элементы DOM =====
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const btnSend = document.getElementById('btnSend');
    const statusEl = document.getElementById('status');

    let currentAiMsg = null;
    let streaming = false;

    // ===== Утилиты =====
    function addMessage(text, cls) {
        const div = document.createElement('div');
        div.className = 'msg ' + cls;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function updateStatus(text) {
        statusEl.textContent = text;
    }

    // ===== Отправка сообщения =====
    async function sendMessage() {
        const text = input.value.trim();
        if (!text || streaming) return;

        addMessage(text, 'user');
        input.value = '';
        btnSend.disabled = true;
        streaming = true;

        try {
            const resp = await fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const data = await resp.json();

            if (!data.ok) {
                addMessage('Ошибка: ' + (data.error || 'неизвестная'), 'error');
                streaming = false;
                btnSend.disabled = false;
                return;
            }

            // Если работал режим MNN — показываем ответ сразу
            if (data.mode === 'mnn' && data.answer) {
                addMessage(data.answer, 'ai');
                streaming = false;
                btnSend.disabled = false;
                return;
            }

            // Иначе — ждём ответ по SSE (режим Xiaozhi)
            addMessage(`[режим: ${data.mode}, ${data.bytes} байт]`, 'system');

        } catch (e) {
            addMessage('Ошибка сети: ' + e.message, 'error');
            streaming = false;
            btnSend.disabled = false;
        }
    }

    // ===== SSE-канал =====
    const es = new EventSource('/events');

    es.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        const kind = data.kind;

        if (kind === 'status') {
            updateStatus(data.text);
            return;
        }

        if (kind === 'error') {
            addMessage('⚠️ ' + data.text, 'error');
            return;
        }

        if (kind === 'audio') {
            addMessage(`[аудио ${data.size} байт]`, 'system');
            return;
        }

        if (kind === 'stt') {
            addMessage(`[stt] ${data.text}`, 'system');
            return;
        }

        if (kind === 'llm') {
            return; // llm — это эмоция, показывать не обязательно
        }

        if (kind === 'tts_start') {
            currentAiMsg = null;
            return;
        }

        if (kind === 'tts') {
            if (data.state === 'sentence_start') {
                if (!currentAiMsg) {
                    currentAiMsg = addMessage('', 'ai');
                }
                currentAiMsg.textContent += (currentAiMsg.textContent ? ' ' : '') + data.text;
                chat.scrollTop = chat.scrollHeight;
            }
            return;
        }

        if (kind === 'tts_stop') {
            currentAiMsg = null;
            streaming = false;
            btnSend.disabled = false;
            return;
        }
    };

    es.onerror = () => {
        updateStatus('SSE-канал отключён, переподключение...');
    };

    // ===== Очистка истории =====
    async function clearHistory() {
        if (!confirm('Очистить историю?')) return;
        await fetch('/clear', { method: 'POST' });
        chat.innerHTML = '';
        addMessage('История очищена', 'system');
    }

    // ===== Загрузка истории при старте =====
    async function loadHistory() {
        try {
            const resp = await fetch('/history');
            const items = await resp.json();
            for (const item of items) {
                addMessage(item.text, item.role === 'user' ? 'user' : 'ai');
            }
        } catch (e) {
            console.error('Ошибка загрузки истории:', e);
        }
    }

    // ===== Работа с моделями MNN =====

    // Загружаем список доступных моделей с сервера
    async function loadModels() {
        const select = document.getElementById('model-dropdown');
        try {
            const resp = await fetch('/models');
            const data = await resp.json();

            select.innerHTML = '';

            if (!data.models || data.models.length === 0) {
                const opt = document.createElement('option');
                opt.textContent = 'Модели не найдены';
                select.appendChild(opt);
                return;
            }

            data.models.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                if (m === data.selected) opt.selected = true;
                select.appendChild(opt);
            });

        } catch (e) {
            console.error('Ошибка загрузки моделей:', e);
            select.innerHTML = '<option>Ошибка загрузки</option>';
        }
    }

    // Включение/выключение режима MNN
    document.getElementById('use-mnn').addEventListener('change', async (e) => {
        const useMnn = e.target.checked;
        const model = document.getElementById('model-dropdown').value;
        document.getElementById('model-dropdown').disabled = !useMnn;

        await fetch('/set_model', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ use_mnn: useMnn, model: model })
        });
    });

    // Смена модели в выпадающем списке
    document.getElementById('model-dropdown').addEventListener('change', async (e) => {
        await fetch('/set_model', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                use_mnn: document.getElementById('use-mnn').checked,
                model: e.target.value
            })
        });
    });

    // Кнопка "Обновить"
    document.getElementById('refresh-models').addEventListener('click', loadModels);

    // ===== Горячие клавиши =====
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ===== Инициализация при старте =====
    loadHistory();
    loadModels();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaozhi — Текстовый режим</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; margin: 0; padding: 10px; }
        #chat { height: 80vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; white-space: pre-wrap; }
        .user { color: #4ec9b0; }
        .ai { color: #ce9178; }
        .status { color: #808080; font-style: italic; }
        #input-area { display: flex; gap: 5px; }
        input { flex: 1; background: #252526; border: 1px solid #3c3c3c; color: #d4d4d4; padding: 8px; }
        button { background: #0e639c; color: white; border: none; padding: 8px 15px; cursor: pointer; }
        button:hover { background: #1177bb; }
        a { color: #569cd6; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
        <strong>Xiaozhi — Текст</strong>
        <a href="/">Графический режим</a>
    </div>
    <div id="chat">Подключение...</div>
    <div id="input-area">
        <input type="text" id="msg" placeholder="Введите сообщение..." autocomplete="off">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const msgInput = document.getElementById('msg');

        // Загрузка истории
        fetch('/history').then(r => r.json()).then(history => {
            chat.innerHTML = '';
            history.forEach(m => addMsg(m.role, m.text));
        });

        // Подключение к SSE
        const evtSource = new EventSource('/events');
        evtSource.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.kind === 'status') addStatus(data.text);
            else if (data.kind === 'stt') addMsg('user', data.text);
            else if (data.kind === 'llm') addMsg('ai', data.text);
            else if (data.kind === 'tts' && data.state === 'sentence_start') addMsg('ai', data.text);
            else if (data.kind === 'error') addStatus('❌ ' + data.text);
        };

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'user' : 'ai';
            div.textContent = (role === 'user' ? 'Вы: ' : 'AI: ') + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addStatus(text) {
            const div = document.createElement('div');
            div.className = 'status';
            div.textContent = '> ' + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            msgInput.value = '';
            fetch('/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            }).then(r => r.json()).then(res => {
                if (!res.ok) addStatus('Ошибка: ' + res.error);
            });
        }

        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        msgInput.focus();
    </script>
</body>
</html>
